<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Quest Controller Position Test</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>

<script>
AFRAME.registerComponent('controller-pose-debug', {
    init: function () {
        this.scene = this.el;
        this.leftController = document.querySelector('#leftController');
        this.rightController = document.querySelector('#rightController');
        this.leftMarker = document.querySelector('#leftMarker');
        this.rightMarker = document.querySelector('#rightMarker');
        this.leftText = document.querySelector('#leftText');
        this.rightText = document.querySelector('#rightText');
        this.statusText = document.querySelector('#statusText');
        this.lastLeft = null;
        this.lastRight = null;
        this.tmp = new THREE.Vector3();

        this.scene.addEventListener('enter-vr', () => {
            this.statusText.setAttribute('value', 'VR gestart. Controllerposities uitlezen...');
        });
    },

    fmt: function (v) {
        return Number(v).toFixed(3);
    },

    updateFromObject3D: function (hand, controller, marker, textEl, previous) {
        if (!controller || !controller.object3D) return previous;

        controller.object3D.getWorldPosition(this.tmp);
        const p = { x: this.tmp.x, y: this.tmp.y, z: this.tmp.z };

        marker.setAttribute('visible', true);
        marker.object3D.position.set(p.x, p.y, p.z);

        let dText = '';
        if (previous) {
            const dx = p.x - previous.x;
            const dy = p.y - previous.y;
            const dz = p.z - previous.z;
            const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
            dText = '\nd=' + this.fmt(d);
        }

        textEl.setAttribute(
            'value',
            hand.toUpperCase() +
            ' [A-Frame world pose]' +
            '\nx=' + this.fmt(p.x) +
            '  y=' + this.fmt(p.y) +
            '  z=' + this.fmt(p.z) +
            dText
        );

        return p;
    },

    tick: function () {
        if (!this.scene.is('vr-mode')) return;

        this.lastLeft = this.updateFromObject3D(
            'left',
            this.leftController,
            this.leftMarker,
            this.leftText,
            this.lastLeft
        );

        this.lastRight = this.updateFromObject3D(
            'right',
            this.rightController,
            this.rightMarker,
            this.rightText,
            this.lastRight
        );

        if (this.lastLeft || this.lastRight) {
            this.statusText.setAttribute(
                'value',
                'Posities worden ontvangen. Test nu x, y en z door de controllers te bewegen.'
            );
        }
    }
});
</script>

<a-scene id="scene" controller-pose-debug background="color: #20364a">

    <a-plane
        position="0 0 -3"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#557755">
    </a-plane>

    <a-box
        position="0 1.4 -2.5"
        width="0.25"
        height="0.25"
        depth="0.25"
        color="#d94b4b">
    </a-box>

    <a-entity id="leftController" laser-controls="hand: left"></a-entity>
    <a-entity id="rightController" laser-controls="hand: right"></a-entity>

    <a-sphere id="leftMarker" radius="0.09" color="#4da6ff" visible="false"></a-sphere>
    <a-sphere id="rightMarker" radius="0.09" color="#ffd84d" visible="false"></a-sphere>

    <a-text
        value="Controller position test"
        position="0 2.45 -2.4"
        align="center"
        width="4"
        color="white">
    </a-text>

    <a-text
        id="leftText"
        value="LEFT: wacht op controller..."
        position="-0.75 2.05 -2.4"
        align="center"
        width="2.6"
        color="#9fd0ff">
    </a-text>

    <a-text
        id="rightText"
        value="RIGHT: wacht op controller..."
        position="0.75 1.75 -2.4"
        align="center"
        width="2.6"
        color="#fff1a8">
    </a-text>

    <a-text
        id="statusText"
        value="Ga naar VR en beweeg beide controllers."
        position="0 1.25 -2.4"
        align="center"
        width="3.2"
        color="white">
    </a-text>

    <a-camera position="0 1.6 0"></a-camera>
</a-scene>

<script>
const statusText = document.querySelector('#statusText');

document.querySelector('#leftController').addEventListener('triggerdown', function () {
    statusText.setAttribute('value', 'LEFT trigger ontvangen');
});

document.querySelector('#rightController').addEventListener('triggerdown', function () {
    statusText.setAttribute('value', 'RIGHT trigger ontvangen');
});
</script>

</body>
</html>
