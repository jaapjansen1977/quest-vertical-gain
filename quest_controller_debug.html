<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Quest Controller Position Test</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

<a-scene id="scene" background="color: #20364a">

    <a-plane
        position="0 0 -3"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#557755">
    </a-plane>

    <!-- Referentieobject -->
    <a-box
        position="0 1.4 -2.5"
        width="0.25"
        height="0.25"
        depth="0.25"
        color="#d94b4b">
    </a-box>

    <!-- A-Frame controller entities blijven aanwezig voor trigger-events -->
    <a-entity id="leftController" laser-controls="hand: left"></a-entity>
    <a-entity id="rightController" laser-controls="hand: right"></a-entity>

    <!-- Markers die rechtstreeks uit raw WebXR worden aangestuurd -->
    <a-sphere id="leftMarker" radius="0.09" color="#4da6ff" visible="false"></a-sphere>
    <a-sphere id="rightMarker" radius="0.09" color="#ffd84d" visible="false"></a-sphere>

    <a-text
        id="titleText"
        value="Controller position test"
        position="0 2.45 -2.4"
        align="center"
        width="4"
        color="white">
    </a-text>

    <a-text
        id="leftText"
        value="LEFT: wacht op controller..."
        position="-0.75 2.05 -2.4"
        align="center"
        width="2.6"
        color="#9fd0ff">
    </a-text>

    <a-text
        id="rightText"
        value="RIGHT: wacht op controller..."
        position="0.75 1.75 -2.4"
        align="center"
        width="2.6"
        color="#fff1a8">
    </a-text>

    <a-text
        id="statusText"
        value="Ga naar VR en beweeg beide controllers."
        position="0 1.25 -2.4"
        align="center"
        width="3.2"
        color="white">
    </a-text>

    <a-camera position="0 1.6 0"></a-camera>
</a-scene>

<script>
const scene = document.querySelector('#scene');
const leftMarker = document.querySelector('#leftMarker');
const rightMarker = document.querySelector('#rightMarker');
const leftText = document.querySelector('#leftText');
const rightText = document.querySelector('#rightText');
const statusText = document.querySelector('#statusText');

let lastLeft = null;
let lastRight = null;

function fmt(v) {
    return v.toFixed(3);
}

function setMarker(marker, pose) {
    const p = pose.transform.position;
    marker.setAttribute('visible', true);
    marker.object3D.position.set(p.x, p.y, p.z);
}

function getPoseForInput(frame, refSpace, inputSource) {
    const space = inputSource.gripSpace || inputSource.targetRaySpace;
    if (!space) return null;
    return frame.getPose(space, refSpace);
}

function controllerLine(label, pose, previous) {
    const p = pose.transform.position;

    let movement = '';
    if (previous) {
        const dx = p.x - previous.x;
        const dy = p.y - previous.y;
        const dz = p.z - previous.z;
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        movement = '  d=' + fmt(d);
    }

    return label +
        '\nx=' + fmt(p.x) +
        '  y=' + fmt(p.y) +
        '  z=' + fmt(p.z) +
        movement;
}

function animate() {
    if (scene.renderer && scene.renderer.xr && scene.renderer.xr.isPresenting) {
        const xr = scene.renderer.xr;
        const frame = xr.getFrame();
        const refSpace = xr.getReferenceSpace();
        const session = xr.getSession();

        if (frame && refSpace && session) {
            let leftFound = false;
            let rightFound = false;

            for (const inputSource of session.inputSources) {
                if (!inputSource.handedness) continue;

                const pose = getPoseForInput(frame, refSpace, inputSource);
                if (!pose) continue;

                const p = pose.transform.position;

                if (inputSource.handedness === 'left') {
                    leftFound = true;
                    setMarker(leftMarker, pose);
                    leftText.setAttribute(
                        'value',
                        controllerLine('LEFT', pose, lastLeft)
                    );
                    lastLeft = { x: p.x, y: p.y, z: p.z };
                }

                if (inputSource.handedness === 'right') {
                    rightFound = true;
                    setMarker(rightMarker, pose);
                    rightText.setAttribute(
                        'value',
                        controllerLine('RIGHT', pose, lastRight)
                    );
                    lastRight = { x: p.x, y: p.y, z: p.z };
                }
            }

            if (leftFound || rightFound) {
                statusText.setAttribute(
                    'value',
                    'Raw WebXR pose ontvangen. Beweeg controllers omhoog/omlaag en links/rechts.'
                );
            } else {
                statusText.setAttribute(
                    'value',
                    'VR actief, maar nog geen controllerpose ontvangen.'
                );
            }

            if (!leftFound) leftMarker.setAttribute('visible', false);
            if (!rightFound) rightMarker.setAttribute('visible', false);
        }
    } else {
        statusText.setAttribute(
            'value',
            'Ga naar VR en beweeg beide controllers.'
        );
    }

    requestAnimationFrame(animate);
}

scene.addEventListener('enter-vr', function () {
    statusText.setAttribute('value', 'VR gestart. Controllers zoeken...');
});

document.querySelector('#leftController').addEventListener('triggerdown', function () {
    statusText.setAttribute('value', 'LEFT trigger ontvangen');
});

document.querySelector('#rightController').addEventListener('triggerdown', function () {
    statusText.setAttribute('value', 'RIGHT trigger ontvangen');
});

animate();
</script>

</body>
</html>
