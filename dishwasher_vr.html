<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Borden uitruimen VR - schouderkalibratie</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <style>
        body { margin:0; font-family:Arial,sans-serif; background:#182028; color:white; }
        #panel { position:fixed; z-index:9999; top:18px; left:18px; width:390px; padding:14px; border-radius:10px; background:rgba(8,14,18,.88); }
        button { padding:9px 13px; border:0; border-radius:8px; font-size:14px; }
        #saveButton { margin-top:10px; }
    </style>
</head>
<body>
<div id="panel">
    <div><strong>Borden uitruimen - VR</strong></div>
    <div id="statusText">Klik eerst op VR. Daarna volgt de schouderkalibratie.</div>
    <div id="detailText">Nog geen schouderpunt opgeslagen.</div>
    <button id="saveButton" disabled>CSV opslaan</button>
</div>

<a-scene id="scene" fog="type: linear; color: #d9e0e5; near: 6; far: 18">
    <a-sky color="#dce5ea"></a-sky>
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.5" position="-2 5 2"></a-entity>

    <a-plane position="0 1.6 -3.4" width="7" height="3.7" color="#e8e2d9"></a-plane>
    <a-plane position="0 0 -2.5" rotation="-90 0 0" width="7" height="7" color="#b9b5ad"></a-plane>

    <!-- Vaatwasser onder -->
    <a-box position="0 0.48 -1.55" width="1.25" height="0.9" depth="0.65" color="#6f7b82"></a-box>
    <a-box position="0 0.18 -1.05" rotation="-65 0 0" width="1.25" height="0.06" depth="0.9" color="#aab3b8"></a-box>
    <a-entity id="waitingPlate" position="0 0.58 -1.12">
        <a-cylinder radius="0.17" height="0.025" rotation="90 0 0" color="#f8f8f3"></a-cylinder>
    </a-entity>

    <!-- Plank boven -->
    <a-box position="0 2.12 -1.5" width="2.2" height="0.08" depth="0.45" color="#9b7657"></a-box>
    <a-entity id="placedPlates" position="0 2.18 -1.30"></a-entity>

    <!-- Eigen visuele handproxy. De echte controller wordt alleen als input gebruikt. -->
    <a-sphere id="vrHand" radius="0.075" color="#c88b62" position="0 1.4 -1.05"></a-sphere>
    <a-entity id="carriedPlate3D" visible="false" position="0 1.35 -1.07">
        <a-cylinder radius="0.16" height="0.025" rotation="90 0 0" color="#f8f8f3"></a-cylinder>
    </a-entity>

    <a-camera id="camera" position="0 1.6 0">
        <a-entity position="0 -0.18 -1.35">
            <a-plane width="1.25" height="0.38" color="#10212a" opacity="0.78"></a-plane>
            <a-text id="hudText" value="Klik eerst op VR." align="center" width="1.1" position="0 0 0.01" color="#ffffff"></a-text>
        </a-entity>
    </a-camera>
</a-scene>

<script src="js/dishwasher_vr_config.js?v=1"></script>
<script src="js/dishwasher_vr_logging.js?v=1"></script>
<script src="js/dishwasher_vr.js?v=1"></script>
</body>
</html>
