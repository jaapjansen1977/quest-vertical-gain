<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vertical Gain Mouse Test</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            cursor: none;
        }

        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background: rgba(255,255,255,0.9);
            padding: 12px;
            font-family: Arial, sans-serif;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div id="info">
    <div><strong>Vertical Gain Test</strong></div>
    <div>Volg de rode bol met de gele bol</div>
    <div id="gainText">Gain: 1.00</div>
    <div id="realYText">Werkelijke Y: 0.00</div>
    <div id="visualYText">Getoonde Y: 0.00</div>
</div>

<a-scene>

    <a-sky color="#AFCFE8"></a-sky>

    <a-plane
        position="0 0 -3"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#888">
    </a-plane>

    <!-- Rode target -->
    <a-sphere
        id="target"
        position="0 1.5 -3"
        radius="0.12"
        color="red">
    </a-sphere>

    <!-- Gele cursor -->
    <a-sphere
        id="cursor"
        position="0 1.5 -2.8"
        radius="0.10"
        color="yellow">
    </a-sphere>

    <a-camera position="0 1.6 0"></a-camera>

</a-scene>

<script>

const target = document.querySelector("#target");
const cursor = document.querySelector("#cursor");

const gainText = document.querySelector("#gainText");
const realYText = document.querySelector("#realYText");
const visualYText = document.querySelector("#visualYText");

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

const startTime = performance.now();

const referenceY = 1.5;

document.addEventListener("mousemove", function(event) {
    mouseX = event.clientX;
    mouseY = event.clientY;
});

function getGain(timeSeconds) {

    if (timeSeconds < 10) return 1.00;
    if (timeSeconds < 20) return 0.95;
    if (timeSeconds < 30) return 0.90;
    if (timeSeconds < 40) return 0.85;
    if (timeSeconds < 50) return 0.90;
    if (timeSeconds < 60) return 0.95;

    return 1.00;
}

function animate() {

    const now = performance.now();
    const elapsed = (now - startTime) / 1000;

    const gain = getGain(elapsed);

    // RODE BOL: beweegt links/rechts EN op/neer
    const targetX =
        1.0 * Math.sin(elapsed * 0.7);

    const targetY =
        1.5 + 0.7 * Math.sin(elapsed * 1.0);

    target.object3D.position.set(
        targetX,
        targetY,
        -3
    );

    // horizontale muispositie: -1 tot +1
    const normalizedMouseX =
        (mouseX / window.innerWidth) * 2 - 1;

    // verticale muispositie: 0 tot 1
    const normalizedMouseY =
        1 - (mouseY / window.innerHeight);

    // "echte" positie
    const realX =
        normalizedMouseX * 1.5;

    const realY =
        0.5 + normalizedMouseY * 2.0;

    // X blijft ongemanipuleerd
    const visualX = realX;

    // alleen Y krijgt gain
    const visualY =
        referenceY +
        gain * (realY - referenceY);

    cursor.object3D.position.set(
        visualX,
        visualY,
        -2.8
    );

    gainText.innerText =
        "Gain: " + gain.toFixed(2);

    realYText.innerText =
        "Werkelijke Y: " + realY.toFixed(2);

    visualYText.innerText =
        "Getoonde Y: " + visualY.toFixed(2);

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
