<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vertical Gain Experiment</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            cursor: none;
        }

        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background: rgba(255,255,255,0.94);
            padding: 14px;
            font-family: Arial, sans-serif;
            border-radius: 8px;
            min-width: 250px;
        }

        button {
            margin-top: 10px;
            margin-right: 6px;
            padding: 9px 14px;
            cursor: pointer;
            font-size: 14px;
        }

        #statusText {
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

<div id="info">

    <div><strong>Vertical Gain Experiment</strong></div>

    <div id="statusText">
        Klaar voor kalibratie
    </div>

    <div>
        Plaats de muis waar je prettig wilt starten
        en klik op Start experiment.
    </div>

    <hr>

    <div id="timeText">Tijd: 0.0 s</div>
    <div id="gainText">Gain: 1.00</div>

    <div id="realYText">
        Werkelijke Y: 1.500
    </div>

    <div id="visualYText">
        Getoonde Y: 1.500
    </div>

    <hr>

    <div id="errorText">
        <strong>Trackingfout: 0.0 cm</strong>
    </div>

    <div id="meanErrorText">
        Gemiddelde fout: 0.0 cm
    </div>

    <button id="startButton">
        Start experiment
    </button>

    <button id="saveButton" disabled>
        CSV opslaan
    </button>

</div>


<a-scene>

    <a-sky color="#AFCFE8"></a-sky>

    <a-plane
        position="0 0 -3"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#888">
    </a-plane>

    <!-- Rode target -->
    <a-sphere
        id="target"
        position="0 1.5 -3"
        radius="0.12"
        color="red">
    </a-sphere>

    <!-- Gele cursor -->
    <a-sphere
        id="cursor"
        position="0 1.5 -2.8"
        radius="0.10"
        color="yellow">
    </a-sphere>

    <a-camera position="0 1.6 0"></a-camera>

</a-scene>


<script>

const target =
    document.querySelector("#target");

const cursor =
    document.querySelector("#cursor");

const startButton =
    document.querySelector("#startButton");

const saveButton =
    document.querySelector("#saveButton");

const statusText =
    document.querySelector("#statusText");

const timeText =
    document.querySelector("#timeText");

const gainText =
    document.querySelector("#gainText");

const realYText =
    document.querySelector("#realYText");

const visualYText =
    document.querySelector("#visualYText");

const errorText =
    document.querySelector("#errorText");

const meanErrorText =
    document.querySelector("#meanErrorText");


// ----------------------------------
// INSTELLINGEN
// ----------------------------------

const referenceX = 0;
const referenceY = 1.5;

const mouseScaleX = 0.003;
const mouseScaleY = 0.003;


// ----------------------------------
// STATUS
// ----------------------------------

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let calibrationMouseX = mouseX;
let calibrationMouseY = mouseY;

let experimentRunning = false;

let startTime = 0;

let data = [];

let errorSum = 0;
let errorCount = 0;

let lastLogTime = 0;


// ----------------------------------
// MUIS
// ----------------------------------

document.addEventListener(
    "mousemove",
    function(event) {

        mouseX = event.clientX;
        mouseY = event.clientY;
    }
);


// ----------------------------------
// GAIN
// ----------------------------------

function getGain(timeSeconds) {

    if (timeSeconds < 10) return 1.00;
    if (timeSeconds < 20) return 0.95;
    if (timeSeconds < 30) return 0.90;
    if (timeSeconds < 40) return 0.85;
    if (timeSeconds < 50) return 0.90;
    if (timeSeconds < 60) return 0.95;

    return 1.00;
}


// ----------------------------------
// START / KALIBRATIE
// ----------------------------------

startButton.addEventListener(
    "click",
    function() {

        // huidige muispositie is de neutrale positie
        calibrationMouseX = mouseX;
        calibrationMouseY = mouseY;

        // reset experiment
        data = [];

        errorSum = 0;
        errorCount = 0;

        startTime = performance.now();
        lastLogTime = startTime;

        experimentRunning = true;

        statusText.innerText =
            "Experiment loopt";

        startButton.innerText =
            "Herstart experiment";

        saveButton.disabled = false;
    }
);


// ----------------------------------
// ANIMATIE
// ----------------------------------

function animate() {

    const now = performance.now();

    let elapsed = 0;
    let gain = 1.00;


    // ====================================================
    // VOOR HET EXPERIMENT
    // ====================================================

    if (!experimentRunning) {

        target.object3D.position.set(
            referenceX,
            referenceY,
            -3
        );

        cursor.object3D.position.set(
            referenceX,
            referenceY,
            -2.8
        );

        requestAnimationFrame(animate);
        return;
    }


    // ====================================================
    // EXPERIMENT
    // ====================================================

    elapsed =
        (now - startTime) / 1000;

    gain =
        getGain(elapsed);


    // ----------------------------------
    // TARGET
    // ----------------------------------

    const targetX =
        1.0 * Math.sin(elapsed * 0.7);

    const targetY =
        referenceY +
        0.7 * Math.sin(elapsed * 1.0);

    target.object3D.position.set(
        targetX,
        targetY,
        -3
    );


    // ----------------------------------
    // MUISBEWEGING T.O.V. KALIBRATIE
    // ----------------------------------

    const deltaMouseX =
        mouseX - calibrationMouseX;

    const deltaMouseY =
        calibrationMouseY - mouseY;


    // fictieve echte controllerpositie

    const realX =
        referenceX +
        deltaMouseX * mouseScaleX;

    const realY =
        referenceY +
        deltaMouseY * mouseScaleY;


    // ----------------------------------
    // VISUELE POSITIE
    // ----------------------------------

    // horizontaal blijft 1 : 1
    const visualX =
        realX;

    // verticale gain
    const visualY =
        referenceY +
        gain *
        (realY - referenceY);


    cursor.object3D.position.set(
        visualX,
        visualY,
        -2.8
    );


    // ----------------------------------
    // TRACKINGFOUT
    // ----------------------------------

    const dx =
        targetX - visualX;

    const dy =
        targetY - visualY;

    const errorMeters =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const errorCm =
        errorMeters * 100;

    errorSum += errorCm;
    errorCount++;

    const meanErrorCm =
        errorSum / errorCount;


    // ----------------------------------
    // DISPLAY
    // ----------------------------------

    timeText.innerText =
        "Tijd: " +
        elapsed.toFixed(1) +
        " s";

    gainText.innerText =
        "Gain: " +
        gain.toFixed(2);

    realYText.innerText =
        "Werkelijke Y: " +
        realY.toFixed(3);

    visualYText.innerText =
        "Getoonde Y: " +
        visualY.toFixed(3);

    errorText.innerHTML =
        "<strong>Trackingfout: " +
        errorCm.toFixed(1) +
        " cm</strong>";

    meanErrorText.innerText =
        "Gemiddelde fout: " +
        meanErrorCm.toFixed(1) +
        " cm";


    // ----------------------------------
    // LOGGING ~ 60 Hz
    // ----------------------------------

    if (now - lastLogTime >= 16) {

        data.push({

            time: elapsed,

            gain: gain,

            target_x: targetX,
            target_y: targetY,

            real_x: realX,
            real_y: realY,

            visual_x: visualX,
            visual_y: visualY,

            error_m: errorMeters,
            error_cm: errorCm,

            mouse_x: mouseX,
            mouse_y: mouseY,

            calibration_mouse_x:
                calibrationMouseX,

            calibration_mouse_y:
                calibrationMouseY
        });

        lastLogTime = now;
    }


    requestAnimationFrame(animate);
}

animate();


// ----------------------------------
// CSV
// ----------------------------------

saveButton.addEventListener(
    "click",
    function() {

        let csv =
            "time_s,gain," +
            "target_x,target_y," +
            "real_x,real_y," +
            "visual_x,visual_y," +
            "error_m,error_cm," +
            "mouse_x,mouse_y," +
            "calibration_mouse_x," +
            "calibration_mouse_y\n";


        data.forEach(
            function(row) {

                csv +=

                    row.time.toFixed(4) + "," +
                    row.gain.toFixed(2) + "," +

                    row.target_x.toFixed(4) + "," +
                    row.target_y.toFixed(4) + "," +

                    row.real_x.toFixed(4) + "," +
                    row.real_y.toFixed(4) + "," +

                    row.visual_x.toFixed(4) + "," +
                    row.visual_y.toFixed(4) + "," +

                    row.error_m.toFixed(4) + "," +
                    row.error_cm.toFixed(2) + "," +

                    row.mouse_x.toFixed(1) + "," +
                    row.mouse_y.toFixed(1) + "," +

                    row.calibration_mouse_x.toFixed(1) + "," +
                    row.calibration_mouse_y.toFixed(1) +

                    "\n";
            }
        );


        const blob =
            new Blob(
                [csv],
                {
                    type:
                    "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            "vertical_gain_experiment.csv";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);
    }
);

</script>

</body>
</html>
