<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Quest Vertical Gain Test</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

<a-scene>

    <!-- Achtergrond -->
    <a-sky color="#AFCFE8"></a-sky>

    <!-- Vloer -->
    <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#777">
    </a-plane>

    <!-- Rode testkubus -->
    <a-box
        position="0 1.5 -3"
        width="0.5"
        height="0.5"
        depth="0.5"
        color="red">
    </a-box>

    <!-- Camera / hoofd -->
    <a-entity position="0 0 0">
        <a-camera position="0 1.6 0"></a-camera>
    </a-entity>

</a-scene>

</body>
</html>
