<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vertical Gain Mouse Test</title>

   <script>

const target = document.querySelector("#target");
const cursor = document.querySelector("#cursor");

const gainText = document.querySelector("#gainText");
const realYText = document.querySelector("#realYText");
const visualYText = document.querySelector("#visualYText");

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let startTime = performance.now();

const referenceY = 1.5;

// muispositie bewaren
document.addEventListener("mousemove", function(event) {
    mouseX = event.clientX;
    mouseY = event.clientY;
});

function getGain(timeSeconds) {

    if (timeSeconds < 10) return 1.00;
    if (timeSeconds < 20) return 0.95;
    if (timeSeconds < 30) return 0.90;
    if (timeSeconds < 40) return 0.85;
    if (timeSeconds < 50) return 0.90;
    if (timeSeconds < 60) return 0.95;

    return 1.00;
}

function animate() {

    const now = performance.now();
    const elapsed = (now - startTime) / 1000;

    const gain = getGain(elapsed);

    // target beweegt in 2D: links/rechts én omhoog/omlaag
    const targetX =
        0.8 * Math.sin(elapsed * 0.7);

    const targetY =
        1.5 + 0.7 * Math.sin(elapsed * 1.0);

    target.setAttribute("position", {
        x: targetX,
        y: targetY,
        z: -3
    });

    // muis X normaliseren naar -1 tot +1
    const normalizedMouseX =
        (mouseX / window.innerWidth) * 2 - 1;

    // muis Y normaliseren naar 0 tot 1
    const normalizedMouseY =
        1 - (mouseY / window.innerHeight);

    // fictieve echte controllerpositie
    const realX =
        normalizedMouseX * 1.2;

    const realY =
        0.5 + normalizedMouseY * 2.0;

    // alleen verticale gain toepassen
    const visualX = realX;

    const visualY =
        referenceY +
        gain * (realY - referenceY);

    cursor.setAttribute("position", {
        x: visualX,
        y: visualY,
        z: -2.8
    });

    gainText.innerText =
        "Gain: " + gain.toFixed(2);

    realYText.innerText =
        "Werkelijke Y: " + realY.toFixed(2);

    visualYText.innerText =
        "Getoonde Y: " + visualY.toFixed(2);

    requestAnimationFrame(animate);
}

animate();

</script>
