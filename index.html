<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vertical Gain Experiment</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background: rgba(255,255,255,0.94);
            padding: 14px;
            border-radius: 8px;
            min-width: 260px;
        }

        button {
            margin-top: 10px;
            margin-right: 6px;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
        }

        #statusText {
            font-weight: bold;
            margin-bottom: 8px;
        }

        #countdown {
            position: fixed;
            inset: 0;
            z-index: 20000;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(0,0,0,0.25);

            font-size: 110px;
            font-weight: bold;
            color: white;

            text-shadow:
                0 0 8px black,
                0 0 20px black;

            pointer-events: none;
        }
    </style>
</head>

<body>

<div id="countdown">3</div>

<div id="info">

    <div><strong>Vertical Gain Experiment</strong></div>

    <div id="statusText">
        Klaar voor start
    </div>

    <div id="instructionText">
        Klik op Start experiment.
    </div>

    <hr>

    <div id="timeText">
        Tijd: 0.0 s / 40 s
    </div>

    <div id="gainText">
        Gain: 1.00
    </div>

    <div id="realYText">
        Werkelijke Y: 1.500
    </div>

    <div id="visualYText">
        Getoonde Y: 1.500
    </div>

    <hr>

    <div id="errorText">
        <strong>Trackingfout: 0.0 cm</strong>
    </div>

    <div id="meanErrorText">
        Gemiddelde fout: 0.0 cm
    </div>

    <button id="startButton">
        Start experiment
    </button>

    <button id="saveButton" disabled>
        CSV opslaan
    </button>

</div>


<a-scene id="scene">

    <a-sky color="#AFCFE8"></a-sky>

    <a-plane
        position="0 0 -3"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#888">
    </a-plane>

    <!-- Rode target -->
    <a-sphere
        id="target"
        position="0 1.5 -3"
        radius="0.12"
        color="red">
    </a-sphere>

    <!-- Gele cursor -->
    <a-sphere
        id="cursor"
        position="0 1.5 -2.8"
        radius="0.10"
        color="yellow">
    </a-sphere>

    <a-camera position="0 1.6 0"></a-camera>

</a-scene>


<script>

const target = document.querySelector("#target");
const cursor = document.querySelector("#cursor");

const startButton = document.querySelector("#startButton");
const saveButton = document.querySelector("#saveButton");

const statusText = document.querySelector("#statusText");
const instructionText = document.querySelector("#instructionText");

const countdown = document.querySelector("#countdown");

const timeText = document.querySelector("#timeText");
const gainText = document.querySelector("#gainText");
const realYText = document.querySelector("#realYText");
const visualYText = document.querySelector("#visualYText");
const errorText = document.querySelector("#errorText");
const meanErrorText = document.querySelector("#meanErrorText");


// ======================================================
// INSTELLINGEN
// ======================================================

const referenceX = 0;
const referenceY = 1.5;

const mouseScaleX = 0.003;
const mouseScaleY = 0.003;

const experimentDuration = 40;


// ======================================================
// STATUS
// ======================================================

let experimentRunning = false;
let countdownRunning = false;
let experimentFinished = false;

let startTime = 0;
let lastLogTime = 0;

// Dit zijn nu de "echte" gesimuleerde controllercoördinaten
let realX = referenceX;
let realY = referenceY;

let data = [];

let errorSum = 0;
let errorCount = 0;


// ======================================================
// POINTER LOCK / RELATIEVE MUISBEWEGING
// ======================================================

document.addEventListener("mousemove", function(event) {

    // Alleen beweging gebruiken tijdens experiment
    if (!experimentRunning) {
        return;
    }

    realX += event.movementX * mouseScaleX;

    realY -= event.movementY * mouseScaleY;
});


// ======================================================
// GAIN
// ======================================================

function getGain(t) {

    if (t < 10) return 1.00;

    if (t < 20) return 0.95;

    if (t < 30) return 0.90;

    return 0.85;
}


// ======================================================
// COUNTDOWN
// ======================================================

function showCountdown() {

    countdownRunning = true;

    countdown.style.display = "flex";

    statusText.innerText =
        "Kalibratie";

    instructionText.innerText =
        "Niet bewegen. De startpositie wordt ingesteld.";

    countdown.innerText = "3";

    setTimeout(function() {

        countdown.innerText = "2";

    }, 1000);

    setTimeout(function() {

        countdown.innerText = "1";

    }, 2000);

    setTimeout(function() {

        countdown.innerText = "START";

    }, 3000);

    setTimeout(function() {

        countdown.style.display = "none";

        // ==================================================
        // HIER WORDT DE POSITIE EXACT OP HET MIDDEN GEZET
        // ==================================================

        realX = referenceX;
        realY = referenceY;

        startTime = performance.now();
        lastLogTime = startTime;

        errorSum = 0;
        errorCount = 0;

        data = [];

        experimentRunning = true;
        countdownRunning = false;
        experimentFinished = false;

        statusText.innerText =
            "Experiment loopt";

        instructionText.innerText =
            "Volg de rode bol zo nauwkeurig mogelijk.";

        startButton.disabled = true;

    }, 3500);
}


// ======================================================
// START
// ======================================================

startButton.addEventListener("click", function() {

    if (experimentRunning || countdownRunning) {
        return;
    }

    // Cursor verdwijnt en muisbeweging wordt relatief
    document.body.requestPointerLock();

    // Rode en gele bol exact samen
    realX = referenceX;
    realY = referenceY;

    target.object3D.position.set(
        referenceX,
        referenceY,
        -3
    );

    cursor.object3D.position.set(
        referenceX,
        referenceY,
        -2.8
    );

    saveButton.disabled = true;

    showCountdown();
});


// ======================================================
// STOP
// ======================================================

function stopExperiment() {

    experimentRunning = false;
    experimentFinished = true;

    if (document.pointerLockElement) {
        document.exitPointerLock();
    }

    statusText.innerText =
        "Experiment klaar";

    instructionText.innerText =
        "Je kunt de meetgegevens nu opslaan.";

    startButton.disabled = false;

    startButton.innerText =
        "Opnieuw starten";

    saveButton.disabled = false;
}


// ======================================================
// ANIMATIE
// ======================================================

function animate() {

    const now = performance.now();


    // --------------------------------------------------
    // VOOR START
    // --------------------------------------------------

    if (!experimentRunning) {

        if (!experimentFinished) {

            target.object3D.position.set(
                referenceX,
                referenceY,
                -3
            );

            cursor.object3D.position.set(
                referenceX,
                referenceY,
                -2.8
            );
        }

        requestAnimationFrame(animate);

        return;
    }


    // --------------------------------------------------
    // TIJD
    // --------------------------------------------------

    const elapsed =
        (now - startTime) / 1000;


    // --------------------------------------------------
    // EINDE NA 40 SECONDEN
    // --------------------------------------------------

    if (elapsed >= experimentDuration) {

        timeText.innerText =
            "Tijd: 40.0 s / 40 s";

        stopExperiment();

        requestAnimationFrame(animate);

        return;
    }


    // --------------------------------------------------
    // GAIN
    // --------------------------------------------------

    const gain =
        getGain(elapsed);


    // --------------------------------------------------
    // TARGET
    // --------------------------------------------------

    const targetX =
        1.0 *
        Math.sin(elapsed * 0.7);

    const targetY =
        referenceY +
        0.7 *
        Math.sin(elapsed * 1.0);

    target.object3D.position.set(
        targetX,
        targetY,
        -3
    );


    // --------------------------------------------------
    // VISUELE CONTROLLERPOSITIE
    // --------------------------------------------------

    // horizontaal: 1 op 1
    const visualX =
        realX;

    // verticaal: gain
    const visualY =
        referenceY +
        gain *
        (realY - referenceY);

    cursor.object3D.position.set(
        visualX,
        visualY,
        -2.8
    );


    // --------------------------------------------------
    // TRACKINGFOUT
    // --------------------------------------------------

    const dx =
        targetX - visualX;

    const dy =
        targetY - visualY;

    const errorMeters =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const errorCm =
        errorMeters * 100;

    errorSum += errorCm;

    errorCount++;

    const meanErrorCm =
        errorSum /
        errorCount;


    // --------------------------------------------------
    // DISPLAY
    // --------------------------------------------------

    timeText.innerText =
        "Tijd: " +
        elapsed.toFixed(1) +
        " s / 40 s";

    gainText.innerText =
        "Gain: " +
        gain.toFixed(2);

    realYText.innerText =
        "Werkelijke Y: " +
        realY.toFixed(3);

    visualYText.innerText =
        "Getoonde Y: " +
        visualY.toFixed(3);

    errorText.innerHTML =
        "<strong>Trackingfout: " +
        errorCm.toFixed(1) +
        " cm</strong>";

    meanErrorText.innerText =
        "Gemiddelde fout: " +
        meanErrorCm.toFixed(1) +
        " cm";


    // --------------------------------------------------
    // DATA LOGGEN ~60 Hz
    // --------------------------------------------------

    if (now - lastLogTime >= 16) {

        data.push({

            time: elapsed,

            gain: gain,

            target_x: targetX,
            target_y: targetY,

            real_x: realX,
            real_y: realY,

            visual_x: visualX,
            visual_y: visualY,

            error_m: errorMeters,
            error_cm: errorCm
        });

        lastLogTime = now;
    }


    requestAnimationFrame(animate);
}

animate();


// ======================================================
// CSV OPSLAAN
// ======================================================

saveButton.addEventListener("click", function() {

    let csv =
        "time_s,gain," +
        "target_x,target_y," +
        "real_x,real_y," +
        "visual_x,visual_y," +
        "error_m,error_cm\n";


    data.forEach(function(row) {

        csv +=

            row.time.toFixed(4) + "," +

            row.gain.toFixed(2) + "," +

            row.target_x.toFixed(4) + "," +
            row.target_y.toFixed(4) + "," +

            row.real_x.toFixed(4) + "," +
            row.real_y.toFixed(4) + "," +

            row.visual_x.toFixed(4) + "," +
            row.visual_y.toFixed(4) + "," +

            row.error_m.toFixed(4) + "," +
            row.error_cm.toFixed(2) +

            "\n";
    });


    const blob =
        new Blob(
            [csv],
            {
                type:
                "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "vertical_gain_experiment.csv";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);
});

</script>

</body>
</html>
